name: motherlode
description: A physics-enriched procedural mining game for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_forge2d: 0.19.0
  flame_audio: ^2.10.0
  flame_riverpod: ^5.0.0
  flutter_riverpod: ^2.5.1
  flame_tiled: ^1.18.0
  hive_flutter: ^1.1.0
  fast_noise: ^2.0.0
  flutter_shaders: ^0.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/pod/
    - assets/images/pod/hull_0/
    - assets/images/drills/
    - assets/images/drills/drill_0/
    - assets/images/drills/drill_1/
    - assets/images/drills/drill_2/
    - assets/images/drills/drill_3/
    - assets/images/drills/drill_4/
    - assets/images/drills/drill_5/
    - assets/images/drills/drill_6/
    - assets/images/buildings/
    - assets/images/backgrounds/
    - assets/images/items/ores/
    - assets/images/items/gems/
    - assets/images/items/rare/
    - assets/images/items/consumables/
    - shaders/reaction_diffusion.frag
